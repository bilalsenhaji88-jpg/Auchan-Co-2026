<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auchan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-white border-b border-gray-200 px-4 sm:px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

      <a href="index.html" class="text-2xl font-black text-red-600 tracking-tight">AUCHAN</a>

      <div class="order-last w-full md:order-none md:w-auto md:flex-1 md:max-w-md">
        <input
          id="searchInput"
          type="text"
          placeholder="Rechercher un produit..."
          class="w-full px-4 py-2 text-sm bg-gray-100 rounded-lg border border-transparent focus:border-red-600 focus:bg-white outline-none"
        >
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <a href="admin.html" class="p-2 text-gray-600 hover:text-red-600 rounded-lg">Admin</a>
        <a href="panier.html" class="bg-red-600 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2">
          <span>Panier</span>
          <span id="cart-count" class="bg-white text-red-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
    <div class="flex flex-col lg:flex-row gap-6">

      <div class="flex-1 min-w-0">

        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
          <div id="categories" class="flex flex-wrap gap-2">
            <button data-category="all" class="px-3 py-1.5 rounded-full text-sm font-medium bg-red-600 text-white">Tous</button>
            <button data-category="Vêtements" class="px-3 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">Vêtements</button>
            <button data-category="Électronique" class="px-3 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">Électronique</button>
          </div>

          <div class="flex gap-2">
            <button id="btn-grid" class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 bg-white">Grille</button>
            <button id="btn-list" class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 bg-white">Liste</button>
          </div>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>

        <div id="pagination" class="flex flex-wrap items-center justify-center gap-2 my-6"></div>
      </div>

      <aside class="w-full lg:w-80 shrink-0">
        <div id="drop-zone" class="lg:sticky lg:top-24 border-2 border-dashed border-gray-300 bg-white rounded-xl p-5 text-center transition-colors">
          <div class="w-12 h-12 mx-auto bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
          </div>
          <p class="font-bold text-sm text-gray-800">Glissez un produit ici</p>
          <p class="text-xs text-gray-400 mt-1">Glissez la carte pour l’ajouter direct au panier</p>

          <ul id="cart-items" class="mt-4 space-y-2 text-left text-sm"></ul>
          <p class="mt-3 font-bold text-sm">Total : <span id="cart-total">0</span> DH</p>
        </div>
      </aside>

    </div>
  </main>

  <footer class="bg-white border-t border-gray-200 mt-auto px-4 sm:px-6 py-8">
    <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 text-sm text-gray-600">
      <div>
        <span class="text-lg font-black text-red-600">AUCHAN</span>
        <p class="text-xs text-gray-400 mt-2">Votre supermarché en ligne.</p>
      </div>
      <div>
        <h4 class="font-bold text-gray-900 mb-2">Navigation</h4>
        <ul class="space-y-1">
          <li><a href="index.html" class="hover:text-red-600">Accueil</a></li>
          <li><a href="panier.html" class="hover:text-red-600">Panier</a></li>
          <li><a href="admin.html" class="hover:text-red-600">Administration</a></li>
        </ul>
      </div>
      <div>
        <h4 class="font-bold text-gray-900 mb-2">Contact</h4>
        <p class="text-xs text-gray-400">contact@auchan.ma</p>
      </div>
    </div>
  </footer>

  <script type="module" src="../js/main.js"></script>

</body>
</html>
